<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret P2P Relay Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-gray-100 h-screen flex flex-col items-center justify-center p-4">

    <!-- 접속 전 설정 화면 -->
    <div id="setupScreen" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 space-y-4">
        <h1 class="text-xl font-bold text-center text-yellow-400">🛡️ 시크릿 비밀 대화방</h1>
        <div>
            <label class="block text-xs text-gray-400 mb-1">방 코드 (예: SKY-8832)</label>
            <input id="roomInput" type="text" placeholder="방 코드를 입력하세요" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-yellow-400">
        </div>
        <div>
            <label class="block text-xs text-gray-400 mb-1">비밀 암호키 (대화 상대와 동일하게 입력)</label>
            <input id="keyInput" type="password" placeholder="암호화 키 (예: secret123)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-yellow-400">
        </div>
        <div>
            <label class="block text-xs text-gray-400 mb-1">방 자동 만료 시간</label>
            <select id="expireSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-yellow-400">
                <option value="60">60초</option>
                <option value="300" selected>5분</option>
                <option value="600">10분</option>
            </select>
        </div>
        <button onclick="joinRoom()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">입장하기</button>
    </div>

    <!-- 채팅 화면 (숨김 상태로 시작) -->
    <div id="chatScreen" class="hidden w-full max-w-lg h-[80vh] bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 flex flex-col overflow-hidden">
        <!-- 상단 헤더 -->
        <div class="bg-slate-700/50 px-4 py-3 flex items-center justify-between border-b border-slate-700">
            <div>
                <span id="displayRoom" class="font-bold text-yellow-400 text-sm"></span>
                <span class="text-xs text-emerald-400 ml-2">● 종단간 암호화 활성화</span>
            </div>
            <button onclick="location.reload()" class="text-xs bg-rose-500/20 text-rose-300 px-2.5 py-1 rounded hover:bg-rose-500/30">나가기</button>
        </div>

        <!-- 메시지 출력 영역 -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>

        <!-- 하단 입력 영역 -->
        <div class="p-3 bg-slate-900 border-t border-slate-700 flex gap-2">
            <input id="messageInput" type="text" placeholder="메시지 입력 (서버에는 암호문만 전달됨)..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-yellow-400" onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-yellow-400 hover:bg-yellow-500 text-slate-950 px-4 py-2 rounded-lg font-bold text-sm transition">전송</button>
        </div>
    </div>

    <script>
        let ws = null;
        let currentRoom = '';
        let secretKey = '';

        // 간단한 XOR 기반 대칭키 암·복호화 함수 (실제 브라우저 Web Crypto API로 고도화 가능)
        function encrypt(text, key) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return btoa(unescape(encodeURIComponent(result))); // Base64 인코딩
        }

        function decrypt(encoded, key) {
            try {
                let text = decodeURIComponent(escape(atob(encoded)));
                let result = '';
                for (let i = 0; i < text.length; i++) {
                    result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return result;
            } catch (e) {
                return '[복호화 실패: 키가 일치하지 않음]';
            }
        }

        function joinRoom() {
            const room = document.getElementById('roomInput').value.trim();
            secretKey = document.getElementById('keyInput').value.trim();
            const expireSeconds = parseInt(document.getElementById('expireSelect').value);

            if (!room || !secretKey) {
                alert('방 코드와 비밀 암호키를 모두 입력해주세요!');
                return;
            }

            currentRoom = room;
            
            // WebSocket 연결 (현재 접속 중인 웹페이지의 호스트 주소 자동 반영, 포트는 8080)
            const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
            const serverHost = location.hostname === 'localhost' ? 'localhost:8080' : `${location.hostname}:8080`;
            ws = new WebSocket(`${protocol}${serverHost}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'JOIN', room, expireSeconds }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'JOINED') {
                    document.getElementById('setupScreen').classList.add('hidden');
                    document.getElementById('chatScreen').classList.remove('hidden');
                    document.getElementById('displayRoom').textContent = `방 코드: ${room}`;
                    appendSystemMessage('안전한 비밀 대화방에 연결되었습니다.');
                } else if (data.type === 'ERROR') {
                    alert(data.message);
                } else if (data.type === 'MESSAGE') {
                    const decryptedText = decrypt(data.encryptedData, secretKey);
                    appendMessage('상대방', decryptedText, 'bg-slate-700 text-gray-200');
                }
            };

            ws.onerror = () => {
                alert('중계 서버에 연결할 수 없습니다. Node.js 서버가 실행 중인지 확인하세요.');
            };
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !ws) return;

            // 1. 전송 전 클라이언트에서 즉시 암호화
            const encryptedData = encrypt(text, secretKey);

            // 2. 서버로 암호문 전송 (서버는 평문을 볼 수 없음)
            ws.send(JSON.stringify({
                type: 'MESSAGE',
                room: currentRoom,
                encryptedData: encryptedData
            }));

            // 3. 내 화면에 표시
            appendMessage('나', text, 'bg-yellow-400 text-slate-950 ml-auto');
            input.value = '';
        }

        function appendMessage(sender, text, styleClass) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `flex flex-col max-w-[80%] ${sender === '나' ? 'ml-auto items-end' : 'mr-auto items-start'}`;
            div.innerHTML = `
                <span class="text-[10px] text-gray-400 mb-0.5">${sender}</span>
                <div class="px-3 py-2 rounded-xl break-words ${styleClass}">${escapeHtml(text)}</div>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function appendSystemMessage(text) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'text-center text-xs text-yellow-500/80 my-2';
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>

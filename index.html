
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret P2P Relay Messenger</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 접속 전 설정 화면 -->
    <div id="setupScreen" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 space-y-4">

        <h1 class="text-xl font-bold text-center text-yellow-400">
            🛡️ 시크릿 비밀 대화방
        </h1>

        <div>
            <label class="block text-xs text-gray-400 mb-1">
                방 코드 (예: SKY-8832)
            </label>
            <input
                id="roomInput"
                type="text"
                maxlength="80"
                placeholder="방 코드를 입력하세요"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-yellow-400">
        </div>

        <div>
            <label class="block text-xs text-gray-400 mb-1">
                비밀 암호키 (상대방과 동일하게 입력)
            </label>
            <input
                id="keyInput"
                type="password"
                placeholder="암호화 키를 입력하세요"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-yellow-400">
        </div>

        <div>
            <label class="block text-xs text-gray-400 mb-1">
                방 자동 만료 시간
            </label>
            <select
                id="expireSelect"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-yellow-400">
                <option value="60">60초</option>
                <option value="300" selected>5분</option>
                <option value="600">10분</option>
            </select>
        </div>

        <button
            id="joinButton"
            onclick="joinRoom()"
            class="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">
            입장하기
        </button>

        <p id="setupStatus" class="text-xs text-gray-400 text-center">
            상대방과 같은 방 코드 및 암호키를 사용하세요.
        </p>
    </div>

    <!-- 채팅 화면 -->
    <div id="chatScreen" class="hidden w-full max-w-lg h-[80vh] min-h-[400px] bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 flex flex-col overflow-hidden">

        <!-- 상단 헤더 -->
        <div class="bg-slate-700/50 px-4 py-3 flex items-center justify-between border-b border-slate-700">
            <div>
                <span id="displayRoom" class="font-bold text-yellow-400 text-sm"></span>
                <div id="connectionStatus" class="text-xs text-emerald-400 mt-1">
                    ● 연결 중
                </div>
            </div>

            <button
                onclick="leaveRoom()"
                class="text-xs bg-rose-500/20 text-rose-300 px-2.5 py-1 rounded hover:bg-rose-500/30">
                나가기
            </button>
        </div>

        <!-- 메시지 출력 영역 -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>

        <!-- 메시지 입력 영역 -->
        <div class="p-3 bg-slate-900 border-t border-slate-700 flex gap-2">
            <input
                id="messageInput"
                type="text"
                maxlength="3000"
                placeholder="메시지 입력..."
                class="flex-1 min-w-0 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-yellow-400"
                onkeydown="if(event.key === 'Enter') sendMessage()">

            <button
                id="sendButton"
                onclick="sendMessage()"
                class="bg-yellow-400 hover:bg-yellow-500 text-slate-950 px-4 py-2 rounded-lg font-bold text-sm transition">
                전송
            </button>
        </div>
    </div>

    <script>
        let ws = null;
        let currentRoom = '';
        let secretKey = '';
        let connecting = false;

        /*
         * 주의:
         * 아래 XOR 암호화는 학습용 예시이며 안전한 암호화가 아닙니다.
         * 실제 민감한 대화에는 사용하지 마세요.
         */

        function encrypt(text, key) {
            if (!key) {
                throw new Error('암호키가 없습니다.');
            }

            let result = '';

            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(
                    text.charCodeAt(i) ^
                    key.charCodeAt(i % key.length)
                );
            }

            return btoa(unescape(encodeURIComponent(result)));
        }

        function decrypt(encoded, key) {
            try {
                if (!key) {
                    throw new Error('암호키가 없습니다.');
                }

                const text = decodeURIComponent(
                    escape(atob(encoded))
                );

                let result = '';

                for (let i = 0; i < text.length; i++) {
                    result += String.fromCharCode(
                        text.charCodeAt(i) ^
                        key.charCodeAt(i % key.length)
                    );
                }

                return result;

            } catch (error) {
                return '[복호화 실패: 암호키를 확인하세요.]';
            }
        }

        function setSetupStatus(message, isError = false) {
            const status = document.getElementById('setupStatus');

            status.textContent = message;
            status.className = isError
                ? 'text-xs text-rose-300 text-center'
                : 'text-xs text-gray-400 text-center';
        }

        function setConnectionStatus(message, isError = false) {
            const status = document.getElementById('connectionStatus');

            status.textContent = '● ' + message;
            status.className = isError
                ? 'text-xs text-rose-300 mt-1'
                : 'text-xs text-emerald-400 mt-1';
        }

        // WebSocket 연결: Render 배포 환경 지원
        function joinRoom() {
            if (connecting) {
                return;
            }

            const room = document
                .getElementById('roomInput')
                .value.trim();

            secretKey = document
                .getElementById('keyInput')
                .value;

            const expireSeconds = Number(
                document.getElementById('expireSelect').value
            );

            if (!room || !secretKey) {
                alert('방 코드와 비밀 암호키를 모두 입력해 주세요.');
                return;
            }

            currentRoom = room;
            connecting = true;

            document.getElementById('joinButton').disabled = true;

            setSetupStatus(
                '서버에 연결 중입니다. 잠시 기다려 주세요.'
            );

            // 현재 페이지의 프로토콜과 호스트를 자동으로 사용합니다.
            // Render HTTPS: wss://happy369.onrender.com
            // localhost HTTP: ws://localhost:포트
            const protocol =
                location.protocol === 'https:' ? 'wss:' : 'ws:';

            const wsUrl = `${protocol}//${location.host}`;

            try {
                ws = new WebSocket(wsUrl);
            } catch (error) {
                connecting = false;
                document.getElementById('joinButton').disabled = false;

                setSetupStatus(
                    'WebSocket 연결 생성 실패: ' + error.message,
                    true
                );

                return;
            }

            const socket = ws;
            let joined = false;

            const timeout = setTimeout(() => {
                if (socket.readyState === WebSocket.CONNECTING) {
                    socket.close();

                    connecting = false;
                    document.getElementById('joinButton').disabled = false;

                    setSetupStatus(
                        '연결 시간 초과. Render의 Events와 Logs를 확인해 주세요.',
                        true
                    );
                }
            }, 45000);

            socket.onopen = () => {
                clearTimeout(timeout);

                socket.send(JSON.stringify({
                    type: 'JOIN',
                    room: room,
                    expireSeconds: expireSeconds
                }));
            };

            socket.onmessage = (event) => {
                let data;

                try {
                    data = JSON.parse(event.data);
                } catch (error) {
                    appendSystemMessage('서버 응답을 읽을 수 없습니다.');
                    return;
                }

                if (data.type === 'JOINED') {
                    joined = true;
                    connecting = false;

                    document.getElementById('setupScreen')
                        .classList.add('hidden');

                    document.getElementById('chatScreen')
                        .classList.remove('hidden');

                    document.getElementById('displayRoom')
                        .textContent = `방 코드: ${room}`;

                    setConnectionStatus('서버에 연결되었습니다');

                    appendSystemMessage(
                        '대화방에 입장했습니다. 상대방도 같은 방 코드로 입장해야 합니다.'
                    );

                } else if (data.type === 'ERROR') {
                    alert(data.message || '서버 오류가 발생했습니다.');

                } else if (data.type === 'MESSAGE') {
                    const decryptedText = decrypt(
                        data.encryptedData,
                        secretKey
                    );

                    appendMessage(
                        '상대방',
                        decryptedText,
                        'bg-slate-700 text-gray-200'
                    );

                } else if (data.type === 'SYSTEM') {
                    appendSystemMessage(
                        data.message || '시스템 알림'
                    );

                } else if (data.type === 'EXPIRED') {
                    appendSystemMessage(
                        data.message || '방이 만료되었습니다.'
                    );

                    setConnectionStatus('방 만료됨', true);
                }
            };

            socket.onerror = () => {
                clearTimeout(timeout);

                if (!joined) {
                    setSetupStatus(
                        '서버 연결 실패. Render의 배포 상태와 Logs를 확인해 주세요.',
                        true
                    );
                } else {
                    setConnectionStatus('연결 오류', true);
                }
            };

            socket.onclose = () => {
                clearTimeout(timeout);

                connecting = false;
                document.getElementById('joinButton').disabled = false;

                if (
                    joined ||
                    !document.getElementById('chatScreen')
                        .classList.contains('hidden')
                ) {
                    setConnectionStatus('연결이 종료되었습니다', true);
                } else {
                    setSetupStatus(
                        '연결이 종료되었습니다. 서버 상태를 확인해 주세요.',
                        true
                    );
                }
            };
        }

        // 메시지 전송
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text) {
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                setConnectionStatus('서버에 연결되어 있지 않습니다', true);

                appendSystemMessage(
                    '전송 실패: 서버 연결을 확인해 주세요.'
                );

                return;
            }

            try {
                const encryptedData = encrypt(text, secretKey);

                ws.send(JSON.stringify({
                    type: 'MESSAGE',
                    room: currentRoom,
                    encryptedData: encryptedData
                }));

                appendMessage(
                    '나',
                    text,
                    'bg-yellow-400 text-slate-950'
                );

                input.value = '';

            } catch (error) {
                appendSystemMessage('메시지 전송에 실패했습니다.');
            }
        }

        // 메시지 화면 출력
        function appendMessage(sender, text, styleClass) {
            const box = document.getElementById('messages');

            const div = document.createElement('div');

            div.className =
                `flex flex-col max-w-[80%] ${
                    sender === '나'
                        ? 'ml-auto items-end'
                        : 'mr-auto items-start'
                }`;

            const senderLabel = document.createElement('span');
            senderLabel.className = 'text-[10px] text-gray-400 mb-0.5';
            senderLabel.textContent = sender;

            const bubble = document.createElement('div');
            bubble.className =
                `px-3 py-2 rounded-xl break-words whitespace-pre-wrap ${styleClass}`;

            // textContent를 사용해 HTML 코드 실행을 방지합니다.
            bubble.textContent = text;

            div.appendChild(senderLabel);
            div.appendChild(bubble);

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 시스템 알림 출력
        function appendSystemMessage(text) {
            const box = document.getElementById('messages');

            const div = document.createElement('div');
            div.className =
                'text-center text-xs text-yellow-500/80 my-2';

            div.textContent = text;

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 채팅방 나가기
        function leaveRoom() {
            if (ws) {
                ws.onclose = null;
                ws.close();
                ws = null;
            }

            currentRoom = '';
            secretKey = '';
            connecting = false;

            document.getElementById('messages').replaceChildren();

            document.getElementById('chatScreen')
                .classList.add('hidden');

            document.getElementById('setupScreen')
                .classList.remove('hidden');

            document.getElementById('joinButton').disabled = false;

            document.getElementById('keyInput').value = '';

            setSetupStatus('대화방에서 나왔습니다.');
        }
    </script>
</body>
</html>
